server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 5m;

  # Re-resolve the API's address so an API restart does not leave nginx with a stale IP.
  resolver 127.0.0.11 valid=10s;
  set $api http://api:8000;

  # Same origin as the pages, so session cookies and server-sent events need no CORS.
  location /api/ {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
  location = /healthz { proxy_pass $api; }
  location = /readyz { proxy_pass $api; }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location / {
    try_files $uri /index.html;
  }
}
