name: hackproof

# Each service lists its own environment (D-029): the model gateway key reaches the worker only,
# the sign-in secrets reach the API only, and only the worker mounts the Docker socket.

x-shared-env: &shared-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://hp:hp@postgres:5432/hp}
  HOST_ARTIFACT_DIR: ${HOST_ARTIFACT_DIR:?Set HOST_ARTIFACT_DIR to an absolute host path in .env}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  REPO_PROVIDER: ${REPO_PROVIDER:-github}
  LOCAL_REMOTES_DIR: /app/fixtures/remotes
  RAILPACK_VERSION: ${RAILPACK_VERSION:-0.43.0}
  RUNNER_VERSION: ${RUNNER_VERSION:-1}
  LINK_TTL_DAYS: ${LINK_TTL_DAYS:-7}
  MAX_CLAIMS_VERSIONS: ${MAX_CLAIMS_VERSIONS:-20}
  MAX_REDRAFTS: ${MAX_REDRAFTS:-3}
  MAX_SUBMISSIONS: ${MAX_SUBMISSIONS:-10}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

# A fault that repeats (an outage, a crash loop) must not fill the disk with logs.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    logging: *logging
    environment:
      POSTGRES_USER: hp
      POSTGRES_PASSWORD: hp
      POSTGRES_DB: hp
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hp -d hp"]
      interval: 2s
      timeout: 3s
      retries: 30

  buildkit:
    image: moby/buildkit:v0.34.2
    container_name: buildkit
    logging: *logging
    privileged: true
    volumes:
      - buildkit:/var/lib/buildkit

  api:
    build:
      context: .
      target: api
    logging: *logging
    environment:
      <<: *shared-env
      ORGANISER_PASSWORD: ${ORGANISER_PASSWORD:?Set ORGANISER_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      APP_ENV: ${APP_ENV:-production}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${HOST_ARTIFACT_DIR}:${HOST_ARTIFACT_DIR}:ro
      - ./fixtures/remotes:/app/fixtures/remotes:ro
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    logging: *logging
    environment:
      <<: *shared-env
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.aicredits.in/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      DRAFT_MODEL: ${DRAFT_MODEL:-anthropic/claude-sonnet-5.5}
      AUDIT_MODEL: ${AUDIT_MODEL:-anthropic/claude-sonnet-5.5}
      BRIEF_MODEL: ${BRIEF_MODEL:-anthropic/claude-sonnet-5.5}
      FAST_MODEL: ${FAST_MODEL:-anthropic/claude-haiku-5.5}
      LLM_MODE: ${LLM_MODE:-live}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-60}
      LLM_REPLAY_DIR: ${LLM_REPLAY_DIR:-fixtures/llm}
      DRAFT_MAX_TOKENS: ${DRAFT_MAX_TOKENS:-16000}
      AUDIT_MAX_STEPS: ${AUDIT_MAX_STEPS:-12}
      AUDIT_MAX_TOKENS: ${AUDIT_MAX_TOKENS:-60000}
      AUDIT_TIMEOUT_S: ${AUDIT_TIMEOUT_S:-120}
      BUILDKIT_HOST: ${BUILDKIT_HOST:-docker-container://buildkit}
      RUNNER_IMAGE: ${RUNNER_IMAGE:-hackproof-runner:1}
      BUILD_TIMEOUT_S: ${BUILD_TIMEOUT_S:-480}
      RUN_TIMEOUT_S: ${RUN_TIMEOUT_S:-600}
      STARTUP_TIMEOUT_S: ${STARTUP_TIMEOUT_S:-60}
      APP_MEMORY: ${APP_MEMORY:-1g}
      APP_CPUS: ${APP_CPUS:-1}
      APP_PIDS_LIMIT: ${APP_PIDS_LIMIT:-256}
      RUNNER_MEMORY: ${RUNNER_MEMORY:-2g}
      WATCH_CONCURRENCY: ${WATCH_CONCURRENCY:-4}
      HEAVY_CONCURRENCY: ${HEAVY_CONCURRENCY:-1}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path inside and outside, so bind-mount paths the worker gives Docker resolve on the host.
      - ${HOST_ARTIFACT_DIR}:${HOST_ARTIFACT_DIR}
      - ./fixtures/remotes:/app/fixtures/remotes:ro
      # The recorded model replies, so LLM_MODE=replay drafts without a network call or cost.
      - ./fixtures/llm:/app/fixtures/llm:ro
    depends_on:
      postgres:
        condition: service_healthy
      buildkit:
        condition: service_started

  web:
    build:
      context: ./web
    logging: *logging
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - api

volumes:
  pgdata:
  buildkit:
