[project]
name = "hackproof"
version = "0.1.0"
description = "Verified build reports for hackathon submissions"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.27",
    "jsonpath-ng>=1.7",
    "itsdangerous>=2.2",
    "tenacity>=9.0",
    "structlog>=24.4",
    "docker>=7.1",
    "anthropic>=0.40",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

# One project, several top-level packages (core, api, worker, runner) run from the repo root.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q -m 'not integration'"
markers = [
    "integration: needs Docker, BuildKit and Railpack; run inside the worker container",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Markdown is excluded so ruff never rewrites code blocks in the brief.
extend-exclude = ["fixtures", "web", ".artifacts", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "T20", "ASYNC", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["core", "api", "worker", "runner", "scripts", "tests"]

[tool.ruff.lint.per-file-ignores]
"api/migrations/versions/*.py" = ["E501"]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
files = ["core"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["jsonpath_ng.*"]
ignore_missing_imports = true
